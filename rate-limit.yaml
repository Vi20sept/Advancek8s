apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limit-config
  namespace: default
data:
  config.yaml: |
    domain: nginx-gateway
    descriptors:
      - key: path
        rate_limit:
          unit: second
          requests_per_unit: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limit-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rate-limit
  template:
    metadata:
      labels:
        app: rate-limit
    spec:
      containers:
      - name: rate-limit
        image: envoyproxy/ratelimit:latest
        args:
          - "--config=/data/config.yaml"
          - "--log_level=info"
        ports:
        - containerPort: 8081
        volumeMounts:
        - name: config-volume
          mountPath: /data
      volumes:
      - name: config-volume
        configMap:
          name: rate-limit-config
---
apiVersion: v1
kind: Service
metadata:
  name: rate-limit-svc
  namespace: default
spec:
  selector:
    app: rate-limit
  ports:
  - port: 8081
    targetPort: 8081

